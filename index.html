<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script id="core">
/* CORE: all money and stock rules live here, separate from the screens */
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const r2=n=>Math.round(n*100)/100;
const Core={
uid:p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
month:()=>ymd(new Date()).slice(0,7),
lastMonths(n){const t=new Date(),o=[];for(let i=n-1;i>=0;i--)o.push(ymd(new Date(t.getFullYear(),t.getMonth()-i,1)).slice(0,7));return o},
demo(){const t=new Date();
 const P=[["Basmati Rice 5kg",380,450,24,10],["Atta 10kg",390,440,6,10],["Toor Dal 1kg",125,150,30,12],["Sunflower Oil 1L",130,155,8,12],["Sugar 1kg",40,46,60,20],["Tea 500g",210,245,15,8],["Maggi 12-pack",140,168,4,10],["Detergent 1kg",95,120,22,8]].map((p,i)=>({id:"p"+i,name:p[0],cost:p[1],price:p[2],stock:p[3],min:p[4]}));
 const sales=[],expenses=[];let n=0;
 for(let m=0;m<6;m++){const y=t.getFullYear(),mo=t.getMonth()-m,cap=m===0?t.getDate():28;
  for(let k=0;k<45;k++){const p=P[(k*3+m)%8],day=Math.min(cap,1+((k*3+m*5)%28));
   sales.push({id:"s"+(n++),date:ymd(new Date(y,mo,day)),pid:p.id,qty:6+((k*7+m*3)%17),price:p.price,cost:p.cost})}
  [["Rent",6000,1],["Salaries",8000,5],["Electricity",1800+m*60,8],["Transport",900+m*40,10],["Packaging",700,12]].forEach(e=>{if(m>0||e[2]<=t.getDate())expenses.push({id:"e"+(n++),date:ymd(new Date(y,mo,e[2])),category:e[0],amount:e[1]})})}
 sales.sort((a,b)=>b.date.localeCompare(a.date));expenses.sort((a,b)=>b.date.localeCompare(a.date));
 return{products:P,sales,expenses}},
summary(d,per){const f=x=>per==="all"||x.date.startsWith(per);let revenue=0,cogs=0,orders=0;
 d.sales.filter(f).forEach(s=>{revenue+=s.qty*s.price;cogs+=s.qty*s.cost;orders++});
 const expenses=d.expenses.filter(f).reduce((a,e)=>a+e.amount,0);
 return{revenue:r2(revenue),cogs:r2(cogs),gross:r2(revenue-cogs),expenses:r2(expenses),net:r2(revenue-cogs-expenses),orders}},
productStats(d,per){return d.products.map(p=>{let units=0,revenue=0,profit=0;
 d.sales.forEach(s=>{if(s.pid===p.id&&(per==="all"||s.date.startsWith(per))){units+=s.qty;revenue+=s.qty*s.price;profit+=s.qty*(s.price-s.cost)}});
 return{name:p.name,units,revenue:r2(revenue),profit:r2(profit)}})},
lowStock:d=>d.products.filter(p=>p.stock<=p.min),
validateSale(d,s,editId){const p=d.products.find(x=>x.id===s.pid);
 if(!s.date)return"Choose a date.";if(!p)return"Choose a product.";
 if(!Number.isInteger(s.qty)||s.qty<1)return"Quantity must be a whole number, 1 or more.";
 if(!(s.price>0))return"Selling price must be greater than 0.";
 if(!(s.cost>=0))return"Purchase cost cannot be negative.";
 const old=editId&&d.sales.find(x=>x.id===editId),avail=p.stock+(old&&old.pid===s.pid?old.qty:0);
 if(s.qty>avail)return"Only "+avail+" in stock for "+p.name+".";return""},
applySale(d,s,editId){const err=Core.validateSale(d,s,editId);if(err)return{err};
 const products=d.products.map(p=>({...p})),old=editId&&d.sales.find(x=>x.id===editId);
 if(old)products.forEach(p=>{if(p.id===old.pid)p.stock+=old.qty});
 products.forEach(p=>{if(p.id===s.pid)p.stock-=s.qty});
 const row={date:s.date,pid:s.pid,qty:s.qty,price:s.price,cost:s.cost,id:editId||Core.uid("s")};
 const sales=editId?d.sales.map(x=>x.id===editId?row:x):[row,...d.sales];
 return{data:{...d,products,sales}}},
removeSale(d,id){const old=d.sales.find(x=>x.id===id);if(!old)return d;
 return{...d,sales:d.sales.filter(x=>x.id!==id),products:d.products.map(p=>p.id===old.pid?{...p,stock:p.stock+old.qty}:p)}},
saveProduct(d,p,id){const name=(p.name||"").trim();if(!name)return{err:"Enter a product name."};
 if(d.products.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return{err:"A product with this name already exists."};
 if(!(p.cost>=0))return{err:"Purchase cost cannot be negative."};if(!(p.price>0))return{err:"Selling price must be greater than 0."};
 if(!Number.isInteger(p.stock)||p.stock<0)return{err:"Stock must be a whole number, 0 or more."};
 if(!Number.isInteger(p.min)||p.min<0)return{err:"Minimum stock must be a whole number, 0 or more."};
 const np={id:id||Core.uid("p"),name,cost:p.cost,price:p.price,stock:p.stock,min:p.min};
 return{data:{...d,products:id?d.products.map(x=>x.id===id?np:x):[...d.products,np]}}},
removeProduct(d,id){if(d.sales.some(s=>s.pid===id))return{err:"This product has sales recorded, so it cannot be deleted."};return{data:{...d,products:d.products.filter(p=>p.id!==id)}}},
saveExpense(d,e,id){if(!e.date)return{err:"Choose a date."};if(!e.category)return{err:"Choose a category."};if(!(e.amount>0))return{err:"Amount must be greater than 0."};
 const ne={id:id||Core.uid("e"),date:e.date,category:e.category,amount:e.amount};
 return{data:{...d,expenses:id?d.expenses.map(x=>x.id===id?ne:x):[ne,...d.expenses]}}},
ask(q,d){q=q.toLowerCase();const mo=/month/.test(q),per=mo?Core.month():"all",lab=mo?"this month":"overall",s=Core.summary(d,per),I=n=>"₹"+Math.round(n).toLocaleString("en-IN");
 const ps=Core.productStats(d,per).filter(x=>x.units>0);
 if(!d.sales.length&&!d.expenses.length)return"There is no data yet. Add some sales and expenses, or reset the demo data in Settings.";
 if(/(product|item).*profit|profit.*(product|item)|most profit|highest profit|best.*profit/.test(q)){if(!ps.length)return"No sales "+lab+" yet.";
  const o=ps.slice().sort((a,b)=>b.profit-a.profit);return o[0].name+" made the most gross profit "+lab+": "+I(o[0].profit)+" from "+o[0].units+" units.\nNext: "+o.slice(1,3).map(x=>x.name+" ("+I(x.profit)+")").join(", ")+".\nGross profit is before shop expenses like rent."}
 if(/expense|spend|spent/.test(q)){const c={};d.expenses.filter(e=>per==="all"||e.date.startsWith(per)).forEach(e=>c[e.category]=(c[e.category]||0)+e.amount);
  const k=Object.entries(c).sort((a,b)=>b[1]-a[1]);return"Operating expenses "+lab+": "+I(s.expenses)+(k.length?".\nBiggest: "+k.slice(0,3).map(x=>x[0]+" "+I(x[1])).join(", ")+".":".")}
 if(/stock|restock|inventory|low/.test(q)){const l=Core.lowStock(d);return l.length?"Low stock items:\n"+l.map(p=>p.name+": "+p.stock+" left (minimum "+p.min+")").join("\n"):"All products are above their minimum stock."}
 if(/top|best.?sell|most sold|popular|sell/.test(q)){const o=ps.slice().sort((a,b)=>b.units-a.units).slice(0,3);return o.length?"Top sellers "+lab+" by units:\n"+o.map((x,i)=>(i+1)+". "+x.name+": "+x.units+" units ("+I(x.revenue)+")").join("\n"):"No sales "+lab+" yet."}
 if(/profit|earn|margin/.test(q))return"Estimated net profit "+lab+": "+I(s.net)+".\nRevenue "+I(s.revenue)+" − product cost "+I(s.cogs)+" = gross profit "+I(s.gross)+"; minus expenses "+I(s.expenses)+".";
 if(/sale|revenue|sold|order|turnover/.test(q))return"Revenue "+lab+": "+I(s.revenue)+" from "+s.orders+" orders (gross profit "+I(s.gross)+").";
 return"I can answer simple questions about your data, for example:\n• Which product made the most profit?\n• What were my expenses this month?\n• What is my net profit?\n• Which items are low on stock?"},
tests(){const T=[],ok=(n,c)=>T.push([n,!!c]);
 const base=()=>({products:[{id:"a",name:"A",cost:30,price:50,stock:10,min:2},{id:"b",name:"B",cost:10,price:15,stock:5,min:1}],sales:[],expenses:[{id:"e1",date:"2026-01-05",category:"Rent",amount:20}]});
 const S=(pid,qty,price,cost,date)=>({date:date===undefined?"2026-01-10":date,pid,qty,price,cost});
 let d=Core.applySale(base(),S("a",3,50,30)).data,s=Core.summary(d,"all");
 ok("Revenue = 3 × ₹50 = ₹150",s.revenue===150);ok("Product cost = 3 × ₹30 = ₹90",s.cogs===90);
 ok("Gross profit = ₹60",s.gross===60);ok("Net profit = 150 − 90 − 20 = ₹40",s.net===40);
 ok("Stock deducted once (10 → 7)",d.products[0].stock===7);
 const id=d.sales[0].id,e=Core.applySale(d,S("a",5,50,30),id).data;
 ok("Edit qty 3 → 5 gives stock 5 (no double deduction)",e.products[0].stock===5&&e.sales.length===1);
 const c=Core.applySale(d,S("b",2,15,10),id).data;
 ok("Changing product restores old stock, deducts new",c.products[0].stock===10&&c.products[1].stock===3);
 ok("Deleting a sale restores stock",Core.removeSale(d,id).products[0].stock===10);
 ok("Rejects quantity 0, negative and decimal",[0,-2,1.5].every(q=>Core.applySale(base(),S("a",q,50,30)).err));
 ok("Rejects quantity above stock",!!Core.applySale(base(),S("a",11,50,30)).err);
 ok("Rejects price 0, negative cost, blank date",[S("a",1,0,30),S("a",1,50,-1),S("a",1,50,30,"")].every(x=>Core.applySale(base(),x).err));
 ok("Rejected sale changes nothing",!Core.applySale(base(),S("a",11,50,30)).data);
 ok("Expense must be above 0",!!Core.saveExpense(base(),{date:"2026-01-01",category:"Rent",amount:-5}).err);
 ok("Duplicate product name rejected",!!Core.saveProduct(base(),{name:"a",cost:1,price:2,stock:1,min:0}).err);
 ok("Product with sales cannot be deleted",!!Core.removeProduct(d,"a").err);
 return T}
};
if(typeof module!=="undefined")module.exports=Core;
</script>

const NAV=[["dashboard","▦","Dashboard"],["sales","₹","Sales"],["expenses","⇩","Expenses"],["inventory","▤","Inventory"],["ai","✦","Ask Guru"],["settings","⚙","Settings"]];

function Dash({d,go}){const[per,setPer]=useState(Core.month());

 const top=Core.productStats(d,per).filter(x=>x.units>0).sort((a,b)=>b.units-a.units).slice(0,5),tm=Math.max(1,...top.map(x=>x.units)),low=Core.lowStock(d);
 return html`<div><div className="hd"><h1>Dashboard</h1><select style=${{width:"auto"}} value=${per} onChange=${e=>setPer(e.target.value)}>${ms.slice().reverse().map(m=>html`<option key=${m} value=${m}>${lbl(m)}</option>`)}<option value="all">All time</option></select></div>
 <div className="hero"><div><div className="hl">Namaste! 🙏</div><div>Aaj ka hisaab, ek nazar mein</div></div><div className="hp">${s.net<0?"Kharcha zyada hai":"Munafa chal raha hai"} · ${inr(s.net)}</div></div>

 <div className="card"><h3>Top-selling products</h3>${top.length?top.map(x=>html`<div key=${x.name} style=${{marginBottom:8}}><div className="li" style=${{border:0,padding:0}}><span>${x.name}</span><b>${x.units} units</b></div><div className="pb"><i style=${{width:(x.units/tm*100)+"%"}}></i></div></div>`):html`<div className="empty">No sales in this period.</div>`}</div></div>
 <div className="card" style=${{marginBottom:12}}><h3>Monthly estimated net profit</h3>${d.sales.length?html`<div className="pc">${pb.map(b=>html`<div className="pcol" key=${b[0]}><span className="pv">${(b[1]<0?"−":"")+"₹"+(Math.abs(b[1])/1000).toFixed(1)+"k"}</span><div className=${"pbar "+(b[1]<0?"n":"p")} style=${b[1]<0?{top:"50%",height:(Math.abs(b[1])/pm*60)+"px"}:{bottom:"50%",height:(b[1]/pm*60)+"px"}}></div><span className="pm">${sh(b[0])}</span></div>`)}</div><div className="mu">Green = profit, red = loss. Gross profit minus expenses.</div>`:html`<div className="empty">No sales yet.</div>`}</div>

function Sales({d,setD}){const[q,setQ]=useState(""),[pf,setPf]=useState("all"),[mf,setMf]=useState("all"),[f,setF0]=useState(null);
 const setF=(nf,k)=>{if(k==="pid"&&!nf.id){const p=d.products.find(x=>x.id===nf.pid);if(p)nf={...nf,price:p.price,cost:p.cost}}setF0(nf)};
 const open=s=>{const p=d.products[0];setF0(s?{id:s.id,date:s.date,pid:s.pid,qty:s.qty,price:s.price,cost:s.cost,err:""}:p?{date:ymd(new Date()),pid:p.id,qty:1,price:p.price,cost:p.cost,err:""}:{err:"Add a product in Inventory first.",date:"",pid:"",qty:1,price:"",cost:""})};

 const rows=d.sales.filter(s=>(pf==="all"||s.pid===pf)&&(mf==="all"||s.date.startsWith(mf))&&nm(s.pid).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));
 const rev=rows.reduce((a,s)=>a+s.qty*s.price,0),gp=rows.reduce((a,s)=>a+s.qty*(s.price-s.cost),0);
 const pv=f&&Number(f.qty)>0&&Number(f.price)>0?html`<div className="mu">Revenue ${inr2(f.qty*f.price)} · Product cost ${inr2(f.qty*f.cost)} · Gross profit ${inr2(f.qty*(f.price-f.cost))}</div>`:null;
 return html`<div><div className="hd"><h1>Sales</h1><button className="btn" onClick=${()=>open()}>+ Add sale</button></div>
 ${f?html`<${Form} title=${f.id?"Edit sale":"Add sale"} f=${f} setF=${setF} onSave=${save} onCancel=${()=>setF0(null)} extra=${pv} fields=${[{k:"date",l:"Date",t:"date"},{k:"pid",l:"Product",o:d.products.map(p=>[p.id,p.name+" (stock "+p.stock+")"])},{k:"qty",l:"Quantity",t:"number",min:1,step:1},{k:"price",l:"Selling price / unit (₹)",t:"number",min:0,step:"0.01"},{k:"cost",l:"Purchase cost / unit (₹)",t:"number",min:0,step:"0.01"}]}/>`:null}
 <div className="bar2"><input placeholder="Search product…" value=${q} onChange=${e=>setQ(e.target.value)}/><select value=${pf} onChange=${e=>setPf(e.target.value)}><option value="all">All products</option>${d.products.map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select><select value=${mf} onChange=${e=>setMf(e.target.value)}><option value="all">All months</option>${Core.lastMonths(6).reverse().map(m=>html`<option key=${m} value=${m}>${lbl(m)}</option>`)}</select></div>
 <p className="mu">${rows.length} sales · Revenue ${inr(rev)} · Gross profit ${inr(gp)}</p>
 <${Tbl} head=${["Date","Product","Qty","Price","Cost","Revenue","Gross profit",""]} empty=${d.sales.length?"No sales match your filters.":"No sales yet. Click “Add sale” to record your first one."} rows=${rows.map(s=>({k:s.id,c:[s.date,nm(s.pid),s.qty,inr2(s.price),inr2(s.cost),inr(s.qty*s.price),html`<span className=${s.price>=s.cost?"gp":"ls"}>${inr(s.qty*(s.price-s.cost))}</span>`,html`<span><button className="lnk" onClick=${()=>open(s)}>Edit</button><${Confirm} label="Delete" onYes=${()=>setD(Core.removeSale(d,s.id))}/></span>`]}))}/></div>`}

function Expenses({d,setD}){const[cf,setCf]=useState("all"),[mf,setMf]=useState("all"),[f,setF]=useState(null);

 <div className="bar2"><select value=${cf} onChange=${e=>setCf(e.target.value)}><option value="all">All categories</option>${CATS.map(c=>html`<option key=${c}>${c}</option>`)}</select><select value=${mf} onChange=${e=>setMf(e.target.value)}><option value="all">All months</option>${Core.lastMonths(6).reverse().map(m=>html`<option key=${m} value=${m}>${lbl(m)}</option>`)}</select></div>
 <p className="mu">${rows.length} expenses · Total ${inr(rows.reduce((a,e)=>a+e.amount,0))}</p>
 <${Tbl} head=${["Date","Category","Amount",""]} empty=${d.expenses.length?"No expenses match your filters.":"No expenses yet. Click “Add expense” to record rent, salaries or bills."} rows=${rows.map(e=>({k:e.id,c:[e.date,e.category,inr2(e.amount),html`<span><button className="lnk" onClick=${()=>open(e)}>Edit</button><${Confirm} label="Delete" onYes=${()=>setD({...d,expenses:d.expenses.filter(x=>x.id!==e.id)})}/></span>`]}))}/></div>`}

function Inventory({d,setD}){const[q,setQ]=useState(""),[lo,setLo]=useState(false),[f,setF]=useState(null),[msg,setMsg]=useState("");
 const open=p=>{setMsg("");setF(p?{id:p.id,name:p.name,cost:p.cost,price:p.price,stock:p.stock,min:p.min,err:""}:{name:"",cost:"",price:"",stock:"",min:5,err:""})};

 ${msg?html`<div className="err">${msg}</div>`:null}
 ${f?html`<${Form} title=${f.id?"Edit product":"Add product"} f=${f} setF=${setF} onSave=${save} onCancel=${()=>setF(null)} fields=${[{k:"name",l:"Product name"},{k:"cost",l:"Purchase cost (₹)",t:"number",min:0,step:"0.01"},{k:"price",l:"Selling price (₹)",t:"number",min:0,step:"0.01"},{k:"stock",l:"Stock quantity",t:"number",min:0,step:1},{k:"min",l:"Minimum stock level",t:"number",min:0,step:1}]}/>`:null}
 <div className="bar2"><input placeholder="Search products…" value=${q} onChange=${e=>setQ(e.target.value)}/><label style=${{display:"flex",alignItems:"center",gap:6}}><input type="checkbox" style=${{width:"auto"}} checked=${lo} onChange=${e=>setLo(e.target.checked)}/>Low stock only</label></div>
 <${Tbl} head=${["Product","Cost","Price","Stock","Min","Status",""]} empty=${d.products.length?"No products match.":"No products yet. Add your first product."} rows=${rows.map(p=>({k:p.id,c:[p.name,inr2(p.cost),inr2(p.price),p.stock,p.min,html`<span className=${"tag "+(p.stock===0?"out":p.stock<=p.min?"low":"ok")}>${p.stock===0?"Out":p.stock<=p.min?"Low":"OK"}</span>`,html`<span><button className="lnk" onClick=${()=>open(p)}>Edit</button><${Confirm} label="Delete" onYes=${()=>{const r=Core.removeProduct(d,p.id);r.err?setMsg(r.err):(setMsg(""),setD(r.data))}}/></span>`]}))}/>
 <p className="mu">Stock goes down automatically when you record a sale, and back up if you delete or reduce that sale.</p></div>`}

function Chat({d}){const[m,setM]=useState([{r:"bot",t:"Namaste! 🙏 I am the Galla Guru demo assistant. I answer by doing simple calculations on the data in this app. No real AI is connected."}]),[q,setQ]=useState("");

 return html`<div><div className="hd"><h1>Settings</h1></div>

function AuthScreen(){const[mode,setMode]=useState("login"),[email,setEmail]=useState(""),[password,setPassword]=useState(""),[busy,setBusy]=useState(false),[message,setMessage]=useState("");
 const submit=async e=>{e.preventDefault();setBusy(true);setMessage("");try{
  if(mode==="signup"){const{data,error}=await    sb.auth.signUp({email:email.trim(),password,options:{emailRedirectTo:"https://shubham7021.github.io/Galla-Guru/"}});if(error)throw error;setMessage(data.session?"Account created. Signing you in…":"Account created. Check your email to confirm it, then log in here.");}
  else{const{error}=await sb.auth.signInWithPassword({email:email.trim(),password});if(error)throw error;}
 }catch(err){setMessage(err.message||"Could not connect. Please try again.")}finally{setBusy(false)}};
 return html`<main style=${{maxWidth:480,margin:"34px auto",padding:20,width:"100%"}}><div className="card" style=${{padding:24}}><div className="brand" style=${{padding:"0 0 8px"}}>🪙 Galla <span>Guru</span></div><h1 style=${{marginBottom:8}}>${mode==="login"?"Welcome back":"Create your shop account"}</h1><p className="mu">${mode==="login"?"Log in to access your shop data from any device.":"Sign up to save your shop data securely to the cloud."}</p>
 <form onSubmit=${submit}><label>Email address<input type="email" autocomplete="email" required value=${email} onChange=${e=>setEmail(e.target.value)} style=${{marginBottom:12}}/></label><label>Password<input type="password" autocomplete=${mode==="login"?"current-password":"new-password"} required minLength="6" value=${password} onChange=${e=>setPassword(e.target.value)} style=${{marginBottom:12}}/></label><button className="btn" type="submit" disabled=${busy} style=${{width:"100%",opacity:busy?.65:1}}>${busy?"Please wait…":mode==="login"?"Log in":"Create account"}</button></form>
 ${message?html`<div className="info" style=${{marginTop:12}}>${message}</div>`:null}<div className="row" style=${{justifyContent:"center",marginTop:14}}><button className="lnk" onClick=${()=>{setMode(mode==="login"?"signup":"login");setMessage("")}}>${mode==="login"?"New here? Create an account":"Already have an account? Log in"}</button></div></div></main>`}

function App(){const[d,setD]=useState(emptyData),[v,setV]=useState("dashboard"),[authUser,setAuthUser]=useState(null),[authReady,setAuthReady]=useState(false),[loadingCloud,setLoadingCloud]=useState(false),[cloudReady,setCloudReady]=useState(false),[cloudStatus,setCloudStatus]=useState("Connecting…");
 const currentUserId=React.useRef(null);
 const cloudLoadSnapshot=React.useRef(null);
 const loadCloud=async user=>{
  setLoadingCloud(true);setCloudReady(false);setCloudStatus("Loading cloud data…");
  try{
   const{data,error}=await sb.from("shop_data").select("app_data").eq("user_id",user.id).maybeSingle();
   if(error)throw error;
   let next;
   if(data&&data.app_data){next=normalizeData(data.app_data)}
   else{
    const local=getLocalData();
    next=emptyData();
    if(local&&window.confirm("Local shop data was found on this device. Migrate this data into your account? Choose Cancel to start with an empty cloud account."))next=local;
    const{error:insertError}=await sb.from("shop_data").upsert({user_id:user.id,app_data:next,updated_at:new Date().toISOString()},{onConflict:"user_id"});
    if(insertError)throw insertError;
   }
   // Prevent an initial stale render from overwriting the data just loaded from cloud.
   cloudLoadSnapshot.current={userId:user.id,data:next};
   setD(next);try{localStorage.setItem(KEY,JSON.stringify(next))}catch(e){}
   setCloudStatus("Cloud sync ready");setCloudReady(true);
  }catch(err){setCloudStatus("Cloud error: "+(err.message||"Unable to load data"));setCloudReady(false)}
  finally{setLoadingCloud(false);setAuthReady(true)}
 };
 useEffect(()=>{
  const{data:{subscription}}=sb.auth.onAuthStateChange((event,session)=>{
   const user=session?.user||null;setAuthUser(user);
   if(user){if(currentUserId.current!==user.id){currentUserId.current=user.id;Promise.resolve().then(()=>loadCloud(user))}}
   else{currentUserId.current=null;if(event==="SIGNED_OUT"){try{localStorage.removeItem(KEY)}catch(e){}}setD(emptyData());setCloudReady(false);setLoadingCloud(false);setCloudStatus("Signed out");setAuthReady(true)}
  });
  return()=>subscription.unsubscribe();
 },[]);
 useEffect(()=>{if(!authUser||!cloudReady)return;
  // Wait until the exact cloud-loaded object is applied before allowing cloud saves.
  const snapshot=cloudLoadSnapshot.current;
  if(snapshot&&snapshot.userId===authUser.id){
   if(d!==snapshot.data)return;
   cloudLoadSnapshot.current=null;
   try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}
   return; // This data is already in the cloud; do not overwrite it on initial load.
  }
  try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}
  const userId=authUser.id,payload=JSON.stringify(d);
  cloudSaveQueue=cloudSaveQueue.then(async()=>{
   const{error}=await sb.from("shop_data").upsert({user_id:userId,app_data:JSON.parse(payload),updated_at:new Date().toISOString()},{onConflict:"user_id"});
   if(error)throw error;
  }).then(()=>{if(currentUserId.current===userId)setCloudStatus("All changes synced")}).catch(err=>{if(currentUserId.current===userId)setCloudStatus("Sync error: "+(err.message||"Please check your connection"))});
 },[d,authUser,cloudReady]);
 const go=x=>{setV(x);window.scrollTo(0,0)};
 if(!authReady)return html`<main style=${{maxWidth:480,margin:"50px auto",padding:20}}><div className="card">Connecting to Galla Guru…</div></main>`;
 if(!authUser)return html`<${AuthScreen}/>`;
 if(loadingCloud)return html`<main style=${{maxWidth:480,margin:"50px auto",padding:20}}><div className="card">Loading your shop data from the cloud…</div></main>`;
 if(authUser&&!cloudReady)return html`<main style=${{maxWidth:480,margin:"50px auto",padding:20}}><div className="card"><h2>Could not load your cloud data</h2><p className="mu">${cloudStatus}</p><p>Please check the Supabase table and policies, then retry. Your shop data is not being edited or saved until cloud loading succeeds.</p><button className="btn" onClick=${()=>loadCloud(authUser)}>Retry cloud connection</button><button className="lnk" onClick=${async()=>{await sb.auth.signOut()}}>Log out</button></div></main>`;
 return html`<div><div className="top"><div className="brand">🪙 Galla <span>Guru</span></div><div className="tg">${cloudStatus} · ${authUser.email||"Signed in"}</div><button className="btn" onClick=${async()=>{await sb.auth.signOut()}}>Log out</button></div><div className="app"><nav className="side">${NAV.map(n=>html`<button key=${n[0]} className=${"nav"+(v===n[0]?" on":"")} onClick=${()=>go(n[0])}><span>${n[1]}</span>${n[2]}</button>`)}</nav>
 <main>${v==="dashboard"?html`<${Dash} d=${d} go=${go}/>`:v==="sales"?html`<${Sales} d=${d} setD=${setD}/>`:v==="expenses"?html`<${Expenses} d=${d} setD=${setD}/>`:v==="inventory"?html`<${Inventory} d=${d} setD=${setD}/>`:v==="ai"?html`<${Chat} d=${d}/>`:html`<${Settings} setD=${setD}/>`}</main></div></div>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script></body></html>
